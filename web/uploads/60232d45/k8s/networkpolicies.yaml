---
# redis-cache ← auth-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cache-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis-cache
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth-service

---
# message-broker ← transaction-service, notification-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: message-broker-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: message-broker
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: transaction-service
    - podSelector:
        matchLabels:
          app: notification-service

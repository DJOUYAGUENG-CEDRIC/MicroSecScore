# =============================================================================
# BankSecure — Manifestes Kubernetes (Deployments)
# Fichier : data/input/k8s/deployments.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nginx:1.19.0
        ports:
        - containerPort: 80
        - containerPort: 443

